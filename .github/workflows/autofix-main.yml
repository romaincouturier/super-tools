name: Autofix main

# Réparation payante uniquement sur demande explicite pour un run CI échoué.
# La CI continue automatiquement, sans déclencher Claude sur chaque commit.

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Identifiant du run CI en échec à corriger"
        required: true
        type: string

concurrency:
  group: autofix-main-${{ inputs.ci_run_id }}
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Valider le run CI demandé
        id: ci
        uses: actions/github-script@v7
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        with:
          script: |
            const id = process.env.CI_RUN_ID;
            if (!/^\d+$/.test(id)) throw new Error('Identifiant CI invalide');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: id });
            if (run.name !== 'CI' || run.head_branch !== 'main' || run.status !== 'completed' || run.conclusion !== 'failure' || run.repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Seul un run CI terminé en échec sur main de ce dépôt peut être réparé');
            }
            core.setOutput('sha', run.head_sha);
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ci.outputs.sha }}
          fetch-depth: 0

      - name: Setup git
        run: |
          git config --global user.name "Claude Code"
          git config --global user.email "claude-code[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vérifier la clé Anthropic
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Secret ANTHROPIC_API_KEY manquant : Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Fix failing CI with Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-4-8
            --max-turns 12
            --max-budget-usd 5
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,Agent
          prompt: |
            Le workflow CI vient d'échouer sur main
            (commit ${{ steps.ci.outputs.sha }}).

            1. Récupère les logs de l'échec :
               gh run view ${{ inputs.ci_run_id }} --log-failed
            2. Reproduis en local (npm run typecheck, bash scripts/check-rules.sh,
               npm test) et identifie la cause racine.
            3. Applique le correctif minimal. Consulte IMPROVEMENTS.md avant de
               coder. Si le commit fautif vient de Lovable, applique aussi la
               règle 013 : simplifie les couches d'abstraction inutiles
               introduites au lieu de contourner le symptôme.
            4. Vérifie : npm run typecheck, bash scripts/check-rules.sh, et les
               tests concernés.
            5. Crée une branche fix/ci-main-<sha-court>, committe, pousse, puis
               ouvre une PR vers main avec gh pr create en décrivant la cause
               et le correctif.

            Ne pousse JAMAIS directement sur main. Si le problème dépasse ton
            périmètre (secret manquant, quota, infrastructure), ouvre une issue
            GitHub avec le diagnostic complet au lieu d'une PR :
            gh issue create --title "CI rouge sur main : <cause>" --body "<diagnostic>"
