name: Scan du mode démo

# Règle [070] : chaque écran interne, ses onglets, menus et modales, rendus en
# mode démo contre un faux Supabase (aucun secret, aucune donnée réelle).
# Le rapport est joint à l'exécution : RAPPORT.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # lundi 7 h (Paris, heure d'été)

jobs:
  scan:
    name: Anonymisation du mode démo
    # Version figée, pour la même raison que le job smoke de ci.yml : l'image
    # ubuntu-latest est passée à Ubuntu 26.04, que Playwright 1.58.2 refuse
    # (« does not support chromium on ubuntu26.04-x64 »), et l'installation du
    # navigateur échoue avant le premier test. À relever avec celle de ci.yml,
    # une fois Playwright monté à une version qui connaît cette image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Scan
        run: npm run scan:demo
        env:
          CI: "true"

      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-mode-demo
          path: test-results/demo-scan/
