name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript + règles + tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Règles IMPROVEMENTS.md
        run: bash scripts/check-rules.sh

      - name: Tests unitaires
        run: npm test

  smoke:
    name: Smoke tests navigateur
    # Version figée, pas ubuntu-latest : l'image des runners est passée à
    # Ubuntu 26.04 le 9 novembre 2026, que Playwright 1.58.2 refuse
    # (« does not support chromium on ubuntu26.04-x64 »), et l'installation du
    # navigateur échoue avant le premier test. À relever une fois Playwright
    # monté à une version qui connaît cette image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://smoke-placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'smoke-placeholder-key' }}

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Smoke tests
        run: npm run test:e2e
